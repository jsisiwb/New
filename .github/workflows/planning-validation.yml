name: planning-validation

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate planning package (schemas, examples, evidence, references, stale terms)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validator dependencies
        run: python -m pip install --quiet "jsonschema>=4.18" referencing
      - name: Run planning-package validator
        run: python tools/validate-planning-package.py --quiet
      - name: Fixture manuscripts are NFC and contain no Hangul
        run: |
          python - <<'PY'
          import unicodedata, re, glob, sys
          bad = 0
          for p in glob.glob("examples/fixture/manuscripts/*.txt"):
              t = open(p, encoding="utf-8").read()
              if t != unicodedata.normalize("NFC", t): print("not NFC:", p); bad += 1
              if re.search(r"[\uac00-\ud7a3]", t): print("Hangul in manuscript:", p); bad += 1
          sys.exit(1 if bad else 0)
          PY
