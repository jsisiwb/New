# gitleaks configuration: default rules plus allowlists for fixture ids that look like tokens.
[extend]
useDefault = true

[allowlist]
description = "Fixture UUIDs, schema hashes and token-estimator ids are not secrets"
regexes = [
  '''0191b2a0-0000-7000-8000-[0-9a-f]{12}''',
  '''sha256:[0-9a-f]{64}''',
  '''sha256:placeholder-[a-z0-9-]+''',
  # Estimator ids recorded in pack manifests (`*_TOKEN_ESTIMATOR_ID = 'korean_chars_v1'` reads as an API key).
  '''^(?:english_estimator|korean_chars)_v[0-9]+$''',
]
# b579f9d exported G5 findings with `key=<uuid>` labels (studio ids, reviewed: no secret); later exports omit them.
commits = [
  '''b579f9d60ffbe0fd7ac08f1e211909bcdad2cdb0''',
]
paths = [
  '''pnpm-lock\.yaml''',
  '''packages/domain/src/generated/.*''',
]
